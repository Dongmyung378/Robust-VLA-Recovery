name: core-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install core package
        run: python -m pip install --no-deps -e .
      - name: Validate default config
        run: python scripts/validate_config.py configs/default.toml
      - name: Validate four-task catalog
        run: python scripts/run_tasks.py --list
      - name: Run smoke tests
        run: python -m unittest discover -s tests -v
      - name: Validate collection plan without simulation
        run: python scripts/run_rollouts.py collect --dry-run

  data-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install data-only dependencies
        run: |
          python -m pip install -r requirements/data.txt
          python -m pip install --no-deps -e .
      - name: Test lossless logger and corruption rejection
        run: python -m unittest discover -s tests -v
